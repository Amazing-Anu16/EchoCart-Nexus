<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'none'; frame-ancestors *;">
  <title>EchoCart Nexus - Smart Product Carousel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* CSS Reset & Design Tokens */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-base: #070B11;
      --bg-surface: #0E1624;
      --bg-card: #141F30;
      --bg-card-hover: #19273D;
      --bg-glass: rgba(20, 31, 48, 0.75);
      
      --cyan-core: #00CAFF;
      --cyan-glow: rgba(0, 202, 255, 0.35);
      --cyan-dim: rgba(0, 202, 255, 0.12);
      
      --emerald-accent: #10B981;
      --emerald-dim: rgba(16, 185, 129, 0.15);
      --amber-accent: #F59E0B;
      --amber-dim: rgba(245, 158, 11, 0.15);
      
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 202, 255, 0.3);
      
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-pill: 9999px;
      
      --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --shadow-ambient: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      --transition-smooth: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 80% 20%, rgba(0, 202, 255, 0.07) 0%, transparent 50%),
        radial-gradient(circle at 20% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
    }

    /* Container for simulated Alexa+ Display */
    .alexa-carousel-container {
      width: 100%;
      max-width: 760px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-ambient);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Alexa Header */
    .carousel-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .alexa-glow-ring {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--cyan-core) 20%, transparent 70%);
      border: 2px solid var(--cyan-core);
      box-shadow: 0 0 14px var(--cyan-core);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px var(--cyan-core); }
      50% { transform: scale(1.06); box-shadow: 0 0 20px var(--cyan-core); }
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-alexa {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--cyan-dim);
      color: var(--cyan-core);
      border: 1px solid rgba(0, 202, 255, 0.3);
      letter-spacing: 0.05em;
    }

    .carousel-nav-arrows {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .arrow-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .arrow-btn:hover {
      background: var(--cyan-core);
      color: #000;
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    .arrow-btn:active {
      transform: scale(0.92);
    }

    /* Category Filter Chips Bar */
    .filter-bar {
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.15);
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-smooth);
    }

    .filter-chip:hover {
      color: var(--text-primary);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .filter-chip.active {
      background: var(--cyan-core);
      color: #050B14;
      border-color: var(--cyan-core);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    /* Horizontal Product Slider Track */
    .slider-viewport {
      width: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
      padding: 24px;
    }

    .slider-viewport::-webkit-scrollbar {
      display: none;
    }

    .slider-track {
      display: flex;
      gap: 20px;
      width: max-content;
    }

    /* Product Card */
    .product-card {
      width: 290px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-snap-align: center;
      position: relative;
      transition: var(--transition-smooth);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .product-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 202, 255, 0.35);
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5), 0 0 18px var(--cyan-dim);
    }

    .card-top-badges {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-badge {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      letter-spacing: 0.04em;
    }

    .rating-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--amber-accent);
      background: var(--amber-dim);
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    /* Vector Product Artwork Stage */
    .product-artwork-stage {
      height: 140px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(0, 0, 0, 0.35) 100%);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    .product-artwork-stage svg {
      width: 100%;
      height: 100%;
      max-height: 110px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
      transition: var(--transition-smooth);
    }

    .product-card:hover .product-artwork-stage svg {
      transform: scale(1.06);
    }

    /* Product Meta Details */
    .product-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-grow: 1;
    }

    .sku-label {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--cyan-core);
      font-weight: 500;
    }

    .product-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.6em;
    }

    .product-desc {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Stock Indicator */
    .stock-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--emerald-accent);
      font-weight: 500;
    }

    .stock-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald-accent);
      box-shadow: 0 0 6px var(--emerald-accent);
    }

    /* Price & Action Row */
    .price-action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border-subtle);
    }

    .price-wrapper {
      display: flex;
      flex-direction: column;
    }

    .price-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .price-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }

    .btn-add-cart {
      height: 44px;
      padding: 0 16px;
      background: var(--cyan-core);
      color: #050B14;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px var(--cyan-glow);
      transition: var(--transition-smooth);
      white-space: nowrap;
    }

    .btn-add-cart:hover {
      box-shadow: 0 6px 20px rgba(0, 202, 255, 0.6);
      transform: translateY(-1px);
    }

    .btn-add-cart:active {
      transform: scale(0.94);
    }

    .btn-add-cart.added {
      background: var(--emerald-accent);
      color: #050B14;
      box-shadow: 0 4px 14px var(--emerald-dim);
    }

    /* Carousel Footer */
    .carousel-footer {
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .alexa-voice-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .alexa-voice-hint span {
      color: var(--cyan-core);
      font-weight: 600;
    }

    .slider-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: var(--transition-smooth);
    }

    .dot.active {
      width: 20px;
      border-radius: var(--radius-pill);
      background: var(--cyan-core);
      box-shadow: 0 0 8px var(--cyan-glow);
    }

    /* Inspector Drawer */
    .inspector-toggle {
      width: 100%;
      max-width: 760px;
      margin-top: 14px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-secondary);
      transition: var(--transition-smooth);
    }

    .inspector-toggle:hover {
      border-color: var(--cyan-core);
      color: var(--text-primary);
    }

    .inspector-panel {
      width: 100%;
      max-width: 760px;
      margin-top: 8px;
      background: #05080E;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .inspector-panel.open {
      display: flex;
    }

    .inspector-log-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
      line-height: 1.4;
      word-break: break-all;
    }

    .log-dir-out { color: var(--cyan-core); }
    .log-dir-in { color: var(--emerald-accent); }
    .log-time { color: var(--text-muted); }

    @media (max-width: 520px) {
      body { padding: 8px; }
      .product-card { width: 250px; }
      .carousel-header { padding: 14px 16px; }
      .slider-viewport { padding: 16px; }
    }
  </style>
</head>
<body>

  <!-- Simulated Alexa+ Interactive Product Carousel Card -->
  <div class="alexa-carousel-container" id="alexaCarouselCard" role="region" aria-label="EchoCart Product Catalog Slider">
    
    <!-- Top Header with Brand & Slider Arrows -->
    <header class="carousel-header">
      <div class="brand-group">
        <div class="alexa-glow-ring" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00CAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">
            Featured Products
            <span class="badge-alexa">Alexa+ UI</span>
          </div>
        </div>
      </div>

      <div class="carousel-nav-arrows">
        <button class="arrow-btn" id="btnPrev" aria-label="Scroll to previous products">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button class="arrow-btn" id="btnNext" aria-label="Scroll to next products">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Category Filter Chips -->
    <nav class="filter-bar" id="categoryFilterBar" aria-label="Product category filters">
      <button class="filter-chip active" data-category="all">All Gear</button>
      <button class="filter-chip" data-category="audio">Audio</button>
      <button class="filter-chip" data-category="home">Home</button>
      <button class="filter-chip" data-category="wearables">Wearables</button>
      <button class="filter-chip" data-category="electronics">Electronics</button>
    </nav>

    <!-- Horizontal Product Slider Viewport -->
    <main class="slider-viewport" id="sliderViewport">
      <div class="slider-track" id="sliderTrack" role="list" aria-label="Catalog items">
        <!-- Dynamically injected product cards -->
      </div>
    </main>

    <!-- Bottom Footer with Voice Hint & Dots -->
    <footer class="carousel-footer">
      <div class="alexa-voice-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00CAFF" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
        Say <span>"Alexa, add headphones to my cart"</span> or tap Add to Cart.
      </div>
      <div class="slider-dots" id="sliderDots" aria-hidden="true">
        <!-- Rendered based on visible slides -->
      </div>
    </footer>
  </div>

  <!-- MCP JSON-RPC Wire Inspector Drawer -->
  <div class="inspector-toggle" id="inspectorToggle" role="button" tabindex="0">
    <span><strong>MCP Apps Protocol Inspector</strong> (@modelcontextprotocol/ext-apps)</span>
    <span id="inspectorCount">0 events</span>
  </div>
  <div class="inspector-panel" id="inspectorPanel">
    <div style="display:flex; justify-content:space-between; color:var(--text-muted); margin-bottom:4px;">
      <span>Channel: window.postMessage</span>
      <span>Target: window.parent</span>
    </div>
    <div class="inspector-log-list" id="inspectorLogList">
      <!-- Events logged here -->
    </div>
  </div>

  <script>
    /**
     * Vector Artwork Generator for EchoCart SKUs
     * Self-contained, CSP-compliant hardware icons.
     */
    const HARDWARE_ARTWORK = {
      "ECHO-PRO-01": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22 55C22 39.536 34.536 27 50 27C65.464 27 78 39.536 78 55" stroke="#00CAFF" stroke-width="6" stroke-linecap="round"/>
        <rect x="14" y="52" width="16" height="28" rx="8" fill="#141F30" stroke="#00CAFF" stroke-width="3"/>
        <rect x="70" y="52" width="16" height="28" rx="8" fill="#141F30" stroke="#00CAFF" stroke-width="3"/>
        <circle cx="22" cy="66" r="3" fill="#00CAFF"/>
        <circle cx="78" cy="66" r="3" fill="#00CAFF"/>
        <path d="M50 24V18" stroke="#00CAFF" stroke-width="3" stroke-linecap="round"/>
      </svg>`,
      "ECHO-EAR-02": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="25" y="32" width="50" height="38" rx="14" fill="#141F30" stroke="#10B981" stroke-width="3"/>
        <path d="M25 45H75" stroke="#10B981" stroke-width="2"/>
        <circle cx="50" cy="56" r="4" fill="#10B981"/>
        <circle cx="38" cy="24" r="7" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="2"/>
        <circle cx="62" cy="24" r="7" fill="#10B981" fill-opacity="0.3" stroke="#10B981" stroke-width="2"/>
      </svg>`,
      "ECHO-SPK-03": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="36" width="70" height="28" rx="8" fill="#141F30" stroke="#00CAFF" stroke-width="3"/>
        <circle cx="34" cy="50" r="8" stroke="#00CAFF" stroke-width="2.5" fill="#070B11"/>
        <circle cx="66" cy="50" r="8" stroke="#00CAFF" stroke-width="2.5" fill="#070B11"/>
        <rect x="47" y="48" width="6" height="4" rx="2" fill="#00CAFF"/>
      </svg>`,
      "ECHO-MIC-04": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="38" y="22" width="24" height="38" rx="12" fill="#141F30" stroke="#F59E0B" stroke-width="3"/>
        <line x1="38" y1="36" x2="62" y2="36" stroke="#F59E0B" stroke-width="2"/>
        <path d="M28 46C28 58.15 37.85 68 50 68C62.15 68 72 58.15 72 46" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
        <path d="M50 68V80M38 80H62" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      </svg>`,
      "ECHO-PWR-05": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="18" y="35" width="64" height="30" rx="8" fill="#141F30" stroke="#00CAFF" stroke-width="3"/>
        <circle cx="36" cy="50" r="8" stroke="#00CAFF" stroke-width="2" stroke-dasharray="2 2"/>
        <circle cx="64" cy="50" r="8" stroke="#00CAFF" stroke-width="2" stroke-dasharray="2 2"/>
        <path d="M48 43L44 51H54L50 59" stroke="#00CAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>`,
      "ECHO-WCH-06": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="40" y="16" width="20" height="68" rx="4" fill="#0E1624" stroke="#64748B" stroke-width="2"/>
        <rect x="30" y="30" width="40" height="40" rx="12" fill="#141F30" stroke="#00CAFF" stroke-width="3"/>
        <circle cx="50" cy="50" r="12" stroke="#10B981" stroke-width="2"/>
        <path d="M50 44V50L54 52" stroke="#00CAFF" stroke-width="2" stroke-linecap="round"/>
      </svg>`,
      "DEFAULT": `<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="22" y="24" width="56" height="52" rx="10" fill="#141F30" stroke="#64748B" stroke-width="3"/>
        <path d="M36 44L50 32L64 44" stroke="#00CAFF" stroke-width="3" stroke-linecap="round"/>
        <circle cx="50" cy="56" r="6" fill="#00CAFF"/>
      </svg>`
    };

    /**
     * Default Catalog Datastore for Fallback & Immediate Demonstration
     */
    const DEFAULT_CATALOG = [
      {
        sku: "ECHO-PRO-01",
        title: "EchoCart Nexus Pro Active Noise-Cancelling Headphones",
        category: "audio",

    /**
     * MCP Apps Product Carousel Bridge
     */
    class McpProductCarouselBridge {
      constructor() {
        this.appInfo = {
          name: "EchoCart-Product-Carousel",
          version: "1.0.0"
        };
        this.protocolVersion = "2025-11-25";
        this.currentUserToken = "usr_token_alpha";
        this.products = [...DEFAULT_CATALOG];
        this.activeCategory = "all";
        this.isHostConnected = false;
        this.logCount = 0;

        this.initDOMElements();
        this.bindEvents();
        this.startHandshake();
        this.render();
      }

      initDOMElements() {
        this.viewport = document.getElementById("sliderViewport");
        this.track = document.getElementById("sliderTrack");
        this.btnPrev = document.getElementById("btnPrev");
        this.btnNext = document.getElementById("btnNext");
        this.dotsContainer = document.getElementById("sliderDots");
        this.filterBar = document.getElementById("categoryFilterBar");
        this.inspectorToggle = document.getElementById("inspectorToggle");
        this.inspectorPanel = document.getElementById("inspectorPanel");
        this.inspectorLogList = document.getElementById("inspectorLogList");
        this.inspectorCount = document.getElementById("inspectorCount");
      }

      bindEvents() {
        window.addEventListener("message", (e) => this.handleIncomingMessage(e));

        this.btnPrev.addEventListener("click", () => {
          this.viewport.scrollBy({ left: -310, behavior: "smooth" });
        });

        this.btnNext.addEventListener("click", () => {
          this.viewport.scrollBy({ left: 310, behavior: "smooth" });
        });

        this.viewport.addEventListener("scroll", () => this.updateDots());

        this.filterBar.addEventListener("click", (e) => {
          const chip = e.target.closest(".filter-chip");
          if (!chip) return;
          this.filterBar.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          this.activeCategory = chip.dataset.category;
          this.render();
        });

        this.inspectorToggle.addEventListener("click", () => {
          this.inspectorPanel.classList.toggle("open");
        });
      }

      logEvent(direction, methodOrId, data) {
        this.logCount++;
        this.inspectorCount.textContent = `${this.logCount} events`;
        const entry = document.createElement("div");
        entry.className = "log-entry";
        const time = new Date().toLocaleTimeString().split(" ")[0];
        const dirClass = direction === "OUT" ? "log-dir-out" : "log-dir-in";
        const dirSymbol = direction === "OUT" ? "→ OUT" : "← IN ";
        entry.innerHTML = `
          <span class="log-time">${time}</span>
          <span class="${dirClass}">${dirSymbol} [${methodOrId}]</span>
          <span>${JSON.stringify(data).slice(0, 110)}...</span>
        `;
        this.inspectorLogList.prepend(entry);
      }

      startHandshake() {
        const initId = "init-" + Date.now();
        const initMessage = {
          jsonrpc: "2.0",
          id: initId,
          method: "ui/initialize",
          params: {
            appInfo: this.appInfo,
            appCapabilities: {
              tools: { call: true }
            },
            protocolVersion: this.protocolVersion
          }
        };

        this.postToHost(initMessage);
        this.logEvent("OUT", "ui/initialize", initMessage);
      }

      postToHost(message) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(message, "*");
        }
      }

      handleIncomingMessage(event) {
        const data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.jsonrpc !== "2.0") return;

        this.isHostConnected = true;

        if (data.method === "ui/tool-result" || data.method === "ui/update-state") {
          this.logEvent("IN", data.method, data.params);
          this.processCatalogResult(data.params);
          return;
        }

        if (data.id) {
          this.logEvent("IN", `resp:${data.id}`, data.result || data.error);
          if (data.result) {
            if (Array.isArray(data.result)) {
              this.products = data.result;
              this.render();
            } else if (data.result.content && data.result.content[0] && data.result.content[0].text) {
              try {
                const parsed = JSON.parse(data.result.content[0].text);
                if (Array.isArray(parsed)) {
                  this.products = parsed;
                  this.render();
                }
              } catch (e) {}
            }
          }
        }
      }

      processCatalogResult(payload) {
        if (!payload) return;
        let items = null;
        if (Array.isArray(payload)) {
          items = payload;
        } else if (payload.products && Array.isArray(payload.products)) {
          items = payload.products;
        } else if (payload.items && Array.isArray(payload.items)) {
          items = payload.items;
        }

        if (items && items.length > 0) {
          this.products = items;
          this.render();
        }
      }

      /**
       * Add to Cart Click -> Emits tools/call for manage_cart via postMessage
       */
      requestAddToCart(sku, buttonEl) {
        buttonEl.disabled = true;
        buttonEl.classList.add("added");
        buttonEl.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
          Added ✓
        `;

        const rpcId = "call-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4);
        const callPayload = {
          jsonrpc: "2.0",
          id: rpcId,
          method: "tools/call",
          params: {
            name: "manage_cart",
            arguments: {
              action: "add",
              sku: sku,
              quantity: 1,
              user_token: this.currentUserToken
            }
          }
        };

        this.postToHost(callPayload);
        this.logEvent("OUT", "tools/call", callPayload);

        setTimeout(() => {
          buttonEl.disabled = false;
          buttonEl.classList.remove("added");
          buttonEl.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            Add to Cart
          `;
        }, 1800);
      }

      render() {
        const filtered = this.products.filter(item => {
          if (this.activeCategory === "all") return true;
          return item.category && item.category.toLowerCase() === this.activeCategory.toLowerCase();
        });

        this.track.innerHTML = "";

        if (filtered.length === 0) {
          this.track.innerHTML = `
            <div style="padding: 40px; text-align: center; color: var(--text-muted); width: 100%;">
              No products found in this category.
            </div>
          `;
          this.dotsContainer.innerHTML = "";
          return;
        }

        filtered.forEach(product => {
          const card = document.createElement("div");
          card.className = "product-card";
          card.setAttribute("role", "listitem");

          const artwork = HARDWARE_ARTWORK[product.sku] || HARDWARE_ARTWORK["DEFAULT"];
          const formattedPrice = Number(product.price).toFixed(2);
          const stock = product.stock || 25;
          const ratings = product.ratings || 4.7;

          card.innerHTML = `
            <div class="card-top-badges">
              <span class="category-badge">${product.category || "General"}</span>
              <span class="rating-badge">★ ${ratings}</span>
            </div>
            <div class="product-artwork-stage" aria-hidden="true">
              ${artwork}
            </div>
            <div class="product-info">
              <span class="sku-label">${product.sku}</span>
              <div class="product-title" title="${product.title}">${product.title}</div>
              <div class="product-desc">${product.description || ""}</div>
            </div>
            <div class="stock-indicator">
              <span class="stock-dot"></span>
              <span>In Stock (${stock} available)</span>
            </div>
            <div class="price-action-row">
              <div class="price-wrapper">
                <span class="price-label">Price</span>
                <span class="price-value">$${formattedPrice}</span>
              </div>
              <button class="btn-add-cart" data-sku="${product.sku}" aria-label="Add ${product.title} to cart">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
                  <line x1="3" y1="6" x2="21" y2="6"/>
                  <path d="M16 10a4 4 0 0 1-8 0"/>
                </svg>
                Add to Cart
              </button>
            </div>
          `;

          const btn = card.querySelector(".btn-add-cart");
          btn.addEventListener("click", () => this.requestAddToCart(product.sku, btn));

          this.track.appendChild(card);
        });

        this.renderDots(filtered.length);
      }

      renderDots(count) {
        this.dotsContainer.innerHTML = "";
        const visibleDots = Math.min(count, 6);
        for (let i = 0; i < visibleDots; i++) {
          const dot = document.createElement("div");
          dot.className = `dot ${i === 0 ? "active" : ""}`;
          this.dotsContainer.appendChild(dot);
        }
      }

      updateDots() {
        const dots = this.dotsContainer.querySelectorAll(".dot");
        if (dots.length === 0) return;
        const scrollLeft = this.viewport.scrollLeft;
        const cardWidth = 310;
        const activeIndex = Math.min(Math.round(scrollLeft / cardWidth), dots.length - 1);
        dots.forEach((dot, idx) => {
          dot.classList.toggle("active", idx === activeIndex);
        });
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      window.echocartCarouselBridge = new McpProductCarouselBridge();
    });
  </script>
